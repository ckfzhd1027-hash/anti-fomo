<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BTC 멀티타임프레임 · 15분/5분/1분</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0e11; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; color: #e5e7eb; }
  #app { height: 100dvh; display: flex; flex-direction: column; }
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px;
    border-bottom: 1px solid #1f2937;
  }
  header .sym { font-size: 15px; font-weight: 900; letter-spacing: .2px; }
  header .px { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
  header .px.up { color: #22c55e; }
  header .px.down { color: #ef4444; }
  header .st { margin-left: auto; font-size: 11px; font-weight: 800; color: #9ca3af; display: flex; align-items: center; gap: 5px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block; }
  header .dot.live { background: #22c55e; }
  header .dot.poll { background: #f59e0b; }
  header .dot.off { background: #ef4444; }
  .chart { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid #1f2937; }
  .chart:last-child { border-bottom: none; }
  .chart-label {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 8px;
    padding: 5px 10px 2px; font-size: 12px;
  }
  .chart-label .tf { font-weight: 900; color: #f59e0b; }
  .chart-label .cp { font-weight: 800; font-variant-numeric: tabular-nums; }
  .chart-label .cp.up { color: #22c55e; }
  .chart-label .cp.down { color: #ef4444; }
  .chart-label .ch { font-weight: 700; color: #9ca3af; font-variant-numeric: tabular-nums; }
  .chart-label .tm { margin-left: auto; color: #6b7280; font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-label .cd { color: #f59e0b; font-weight: 800; font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  canvas { flex: 1 1 auto; width: 100%; min-height: 0; display: block; touch-action: none; }
  #err {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: none; padding: 10px 12px; border-radius: 10px; background: #7f1d1d; color: #fecaca;
    font-size: 12px; font-weight: 700; z-index: 10;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="sym">BTC-USDT</span>
    <span id="hdrPx" class="px">—</span>
    <span class="st"><span id="stDot" class="dot"></span><span id="stTxt">연결 중…</span></span>
  </header>
  <section class="chart" id="sec15">
    <div class="chart-label"><span class="tf">15분봉</span><span class="cp" id="cp15">—</span><span class="ch" id="ch15"></span><span class="tm" id="tm15"></span><span class="cd" id="cd15"></span></div>
    <canvas id="cv15"></canvas>
  </section>
  <section class="chart" id="sec5">
    <div class="chart-label"><span class="tf">5분봉</span><span class="cp" id="cp5">—</span><span class="ch" id="ch5"></span><span class="tm" id="tm5"></span><span class="cd" id="cd5"></span></div>
    <canvas id="cv5"></canvas>
  </section>
  <section class="chart" id="sec1">
    <div class="chart-label"><span class="tf">1분봉</span><span class="cp" id="cp1">—</span><span class="ch" id="ch1"></span><span class="tm" id="tm1"></span><span class="cd" id="cd1"></span></div>
    <canvas id="cv1"></canvas>
  </section>
</div>
<div id="err"></div>
<script>
(function () {
  "use strict";
  var INST = "BTC-USDT-SWAP";
  var REST = "https://www.okx.com/api/v5/market/candles";
  var WS_URL = "wss://ws.okx.com/ws/v5/business";
  var WS_URL_TRADES = "wss://ws.okx.com/ws/v5/public";
  var LIMIT = 200;         // 가져올 봉 수 (팬으로 볼 수 있는 과거 범위)
  var MAX_SHOW = 52;       // 화면에 그릴 봉 수
  var UP = "#22c55e", DOWN = "#ef4444", GRID = "#1f2937", TXT = "#9ca3af";
  var TF = [
    { key: "15m", bar: "15m", ch: "candle15m", cv: "cv15", cp: "cp15", chg: "ch15", tm: "tm15", cd: "cd15", ms: 15 * 60 * 1000 },
    { key: "5m",  bar: "5m",  ch: "candle5m",  cv: "cv5",  cp: "cp5",  chg: "ch5",  tm: "tm5",  cd: "cd5",  ms: 5 * 60 * 1000 },
    { key: "1m",  bar: "1m",  ch: "candle1m",  cv: "cv1",  cp: "cp1",  chg: "ch1",  tm: "tm1",  cd: "cd1",  ms: 1 * 60 * 1000 }
  ];
  var data = { "15m": [], "5m": [], "1m": [] };   // 각 [ts,o,h,l,c,vol] (오름차순)
  var ws = null, wsLive = false, pollTimer = null, pingTimer = null, lastPx = null, resubDone = false;
  var wsTrades = null, pingTradesTimer = null, redrawPending = false;
  var viewEndTs = null;   // null이면 최신 따라감, 아니면 오른쪽 끝 시간(ms) — 세 시간대 공유
  var zoomLevel = 1;      // 1 = 52봉, 클수록 확대(봉 수 감소) — 세 시간대 공유
  var viewStep = {};      // 타임프레임별 px/봉 (팬 변환용)

  function $(id) { return document.getElementById(id); }
  function fmt(n) { return Number(n).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function fmtTime(ts) {
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function showErr(msg) { var e = $("err"); e.textContent = msg; e.style.display = "block"; }
  function hideErr() { $("err").style.display = "none"; }
  function setStatus(mode, txt) {
    var dot = $("stDot"), t = $("stTxt");
    dot.className = "dot " + mode;
    t.textContent = txt;
  }

  // ---- 데이터 ----
  function parseRow(r) {
    return [Number(r[0]), Number(r[1]), Number(r[2]), Number(r[3]), Number(r[4]), Number(r[5])];
  }
  function loadRest(tf) {
    return fetch(REST + "?instId=" + INST + "&bar=" + tf.bar + "&limit=" + LIMIT)
      .then(function (res) { return res.json(); })
      .then(function (j) {
        if (j.code !== "0" || !j.data) throw new Error("REST " + tf.bar + " code=" + j.code);
        var rows = j.data.map(parseRow).reverse(); // 오름차순으로
        data[tf.key] = rows.slice(-LIMIT);
      });
  }
  function applyWsCandle(tf, row) {
    var arr = data[tf.key];
    if (!arr.length) { arr.push(row); return; }
    var last = arr[arr.length - 1];
    if (row[0] === last[0]) {
      // 같은 봉: 시가 유지, 고·저·종·거래량 갱신
      last[2] = Math.max(last[2], row[2]);
      last[3] = Math.min(last[3], row[3]);
      last[4] = row[4];
      last[5] = row[5];
    } else if (row[0] > last[0]) {
      last[4] = row[1]; // 이전 봉 종가 = 새 봉 시가 (체인 유지)
      arr.push(row);
      if (arr.length > LIMIT) arr.shift();
    }
  }
  // ---- 체결로 현재 봉을 바로 갱신 (최대 속도: 체결마다 종·고·저 갱신) ----
  function applyTrade(px, ts) {
    for (var i = 0; i < TF.length; i++) {
      var tf = TF[i];
      var arr = data[tf.key];
      if (!arr.length) continue;
      var last = arr[arr.length - 1];
      if (ts >= last[0] && ts < last[0] + tf.ms) {
        last[4] = px;
        if (px > last[2]) last[2] = px;
        if (px < last[3]) last[3] = px;
      }
    }
  }
  function requestRedraw() {
    if (redrawPending) return;
    redrawPending = true;
    requestAnimationFrame(function () { redrawPending = false; drawAll(); });
  }

  // ---- 그리기 ----
  function fitCanvas(cv) {
    var r = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    return { w: r.width, h: r.height, dpr: dpr };
  }
  function draw(tf) {
    var cv = $(tf.cv);
    var m = fitCanvas(cv);
    var ctx = cv.getContext("2d");
    ctx.setTransform(m.dpr, 0, 0, m.dpr, 0, 0);
    var W = m.w, H = m.h;
    ctx.clearRect(0, 0, W, H);
    var arr = data[tf.key];
    if (!arr.length) return;
    var count = Math.max(8, Math.min(LIMIT, Math.round(MAX_SHOW / zoomLevel)));
    var endIdx = arr.length - 1;
    if (viewEndTs !== null) {
      endIdx = -1;
      for (var k = arr.length - 1; k >= 0; k--) {
        if (arr[k][0] <= viewEndTs) { endIdx = k; break; }
      }
      if (endIdx < 0) endIdx = 0;
    }
    // 창이 항상 count개로 차게: 끝이 너무 앞이면 count개가 보이도록 밀어줌 (1~2개만 보이면 거대하게 그려짐)
    var minEnd = Math.min(count - 1, arr.length - 1);
    if (endIdx < minEnd) endIdx = minEnd;
    var show = arr.slice(Math.max(0, endIdx - count + 1), endIdx + 1);
    if (!show.length) return;
    var padR = 56;                       // 오른쪽 가격 눈금 폭
    var plotW = W - padR - 4, plotH = H - 4;
    var volH = Math.max(18, Math.round(plotH * 0.22));
    var bodyH = plotH - volH - 8;
    var lo = Infinity, hi = -Infinity, vmax = 0;
    for (var i = 0; i < show.length; i++) {
      if (show[i][3] < lo) lo = show[i][3];
      if (show[i][2] > hi) hi = show[i][2];
      if (show[i][5] > vmax) vmax = show[i][5];
    }
    if (hi <= lo) { hi = lo + 1; }
    var pad = (hi - lo) * 0.08 || 1;
    hi += pad; lo -= pad;
    function y(p) { return 2 + (hi - p) / (hi - lo) * bodyH; }
    var n = show.length;
    var step = plotW / n;
    var bw = Math.max(2, Math.floor(step * 0.62));
    viewStep[tf.key] = step;
    // 그리드 + 가격 눈금
    ctx.strokeStyle = GRID; ctx.fillStyle = TXT;
    ctx.lineWidth = 1; ctx.font = "10px -apple-system, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    var ticks = 4;
    for (var t = 0; t <= ticks; t++) {
      var pv = hi - (hi - lo) * t / ticks;
      var yy = 2 + (hi - pv) / (hi - lo) * bodyH;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
      ctx.fillText(fmt(pv), plotW + 5, yy);
    }
    // 캔들 + 거래량
    for (var j = 0; j < n; j++) {
      var c = show[j];
      var x = j * step + (step - bw) / 2;
      var cx = x + bw / 2;
      var up = c[4] >= c[1];
      var col = up ? UP : DOWN;
      var top = Math.min(c[1], c[4]), bot = Math.max(c[1], c[4]);
      var bh = Math.max(1, y(top) - y(bot));
      // 심지
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, y(c[2])); ctx.lineTo(cx, y(c[3])); ctx.stroke();
      // 몸통 (y(bot)=위쪽 끝, y(top)=아래쪽 끝 — fillRect는 위쪽부터 그린다)
      ctx.fillStyle = col;
      ctx.fillRect(x, y(bot), bw, bh);
      // 거래량 (하단)
      var vh = vmax > 0 ? (c[5] / vmax) * volH : 0;
      ctx.globalAlpha = 0.55;
      ctx.fillRect(x, 2 + bodyH + 4 + (volH - vh), bw, vh);
      ctx.globalAlpha = 1;
    }
    // 현재가 점선 + 라벨
    var lastC = show[n - 1][4];
    var ly = y(lastC);
    var lcol = show[n - 1][4] >= show[n - 1][1] ? UP : DOWN;
    ctx.strokeStyle = lcol; ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(plotW, ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = lcol;
    var label = fmt(lastC);
    var tw = ctx.measureText(label).width + 10;
    ctx.fillRect(W - tw - 2, ly - 8, tw, 16);
    ctx.fillStyle = "#0b0e11"; ctx.textAlign = "center";
    ctx.fillText(label, W - tw / 2 - 2, ly);
    ctx.textAlign = "left";
    return { last: show[n - 1], first: show[0] };
  }
  function drawAll() {
    for (var i = 0; i < TF.length; i++) {
      var tf = TF[i];
      var r = draw(tf);
      if (!r) continue;
      var last = r.last, first = r.first;
      var cp = $(tf.cp), chg = $(tf.chg), tm = $(tf.tm);
      cp.textContent = fmt(last[4]);
      cp.className = "cp " + (last[4] >= last[1] ? "up" : "down");
      var pct = ((last[4] - first[1]) / first[1] * 100);
      chg.textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
      chg.style.color = pct >= 0 ? UP : DOWN;
      tm.textContent = fmtTime(last[0]) + "봉";
      if (tf.key === "1m") {
        var hp = $("hdrPx");
        var live = data["1m"][data["1m"].length - 1];
        if (live) {
          hp.textContent = fmt(live[4]);
          var dir = lastPx === null ? "" : (live[4] >= lastPx ? "up" : "down");
          hp.className = "px " + dir;
          lastPx = live[4];
        }
      }
    }
  }

  // ---- 봉 마감 카운터 (1초마다, 실시간 봉 기준 — 팬해도 라이브 기준) ----
  function fmtCountdown(ms) {
    if (ms <= 0) return "00:00";
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }
  function updateCountdowns() {
    for (var i = 0; i < TF.length; i++) {
      var tf = TF[i];
      var el = $(tf.cd);
      if (!el) continue;
      var arr = data[tf.key];
      if (!arr.length) { el.textContent = ""; continue; }
      var last = arr[arr.length - 1];
      var remain = (last[0] + tf.ms) - Date.now();
      el.textContent = "마감 " + fmtCountdown(remain);
    }
  }

  // ---- 웹소켓 ----
  function connectWs() {
    try { ws = new WebSocket(WS_URL); } catch (e) { startPolling(); return; }
    ws.onopen = function () {
      resubDone = false;
      var args = TF.map(function (tf) { return { channel: tf.ch, instId: INST }; });
      ws.send(JSON.stringify({ op: "subscribe", args: args }));
      if (pingTimer) clearInterval(pingTimer);
      pingTimer = setInterval(function () {
        try { if (ws && ws.readyState === 1) ws.send("ping"); } catch (e) {}
      }, 25000);
    };
    ws.onmessage = function (ev) {
      if (ev.data === "pong") return;
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.event) {
        if (msg.event === "error") {
          showErr("WS: " + JSON.stringify(msg));
          if (!resubDone) {
            resubDone = true;
            setTimeout(function () {
              try { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ op: "subscribe", args: TF.map(function (tf) { return { channel: tf.ch, instId: INST }; }) })); } catch (e) {}
            }, 1000);
          }
        }
        return;
      }
      if (!msg.data || !msg.arg) return;
      var tf = null;
      for (var i = 0; i < TF.length; i++) if (TF[i].ch === msg.arg.channel) tf = TF[i];
      if (!tf) return;
      var row = parseRow(msg.data[0]);
      applyWsCandle(tf, row);
      if (!wsLive) { wsLive = true; setStatus("live", "실시간"); stopPolling(); hideErr(); }
      drawAll();
    };
    ws.onclose = function () {
      wsLive = false;
      if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
      setStatus("poll", "재연결 중…");
      startPolling();
      setTimeout(connectWs, 3000);
    };
    ws.onerror = function () { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } try { ws.close(); } catch (e) {} };
  }

  // ---- 실시간 웹소켓 (public, 체결+틱커로 현재 봉 갱신) ----
  function connectTrades() {
    try { wsTrades = new WebSocket(WS_URL_TRADES); } catch (e) { return; }
    wsTrades.onopen = function () {
      wsTrades.send(JSON.stringify({ op: "subscribe", args: [{ channel: "trades", instId: INST }, { channel: "tickers", instId: INST }] }));
      if (pingTradesTimer) clearInterval(pingTradesTimer);
      pingTradesTimer = setInterval(function () {
        try { if (wsTrades && wsTrades.readyState === 1) wsTrades.send("ping"); } catch (e) {}
      }, 25000);
    };
    wsTrades.onmessage = function (ev) {
      if (ev.data === "pong") return;
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.event) {
        if (msg.event === "error") showErr("WS 체결: " + JSON.stringify(msg));
        return;
      }
      if (!msg.data || !msg.arg) return;
      if (msg.arg.channel === "trades") {
        for (var i = 0; i < msg.data.length; i++) {
          var t = msg.data[i];
          applyTrade(Number(t.px), Number(t.ts));
        }
      } else if (msg.arg.channel === "tickers") {
        var d = msg.data[0];
        applyTrade(Number(d.last), Number(d.ts));
      } else {
        return;
      }
      requestRedraw();
    };
    wsTrades.onclose = function () {
      if (pingTradesTimer) { clearInterval(pingTradesTimer); pingTradesTimer = null; }
      setTimeout(connectTrades, 3000);
    };
    wsTrades.onerror = function () { if (pingTradesTimer) { clearInterval(pingTradesTimer); pingTradesTimer = null; } try { wsTrades.close(); } catch (e) {} };
  }

  // ---- 폴백: 2초 REST 폴링 ----
  function pollOnce() {
    Promise.all(TF.map(loadRest)).then(function () { drawAll(); }).catch(function () {});
  }
  function startPolling() {
    if (pollTimer) return;
    setStatus("poll", "2초 갱신");
    pollTimer = setInterval(pollOnce, 2000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ---- 터치: 한 손가락 팬 + 두 손가락 핀치 줌 + 더블탭 리셋 (세 시간대 동기화) ----
  function clampViewEnd() {
    if (viewEndTs === null) return;
    var latest = 0, earliest = Infinity;
    for (var i = 0; i < TF.length; i++) {
      var a = data[TF[i].key];
      if (!a.length) continue;
      if (a[a.length - 1][0] > latest) latest = a[a.length - 1][0];
      if (a[0][0] < earliest) earliest = a[0][0];
    }
    if (latest && viewEndTs >= latest) { viewEndTs = null; return; }
    if (earliest !== Infinity && viewEndTs < earliest) viewEndTs = earliest;
  }
  function attachTouch(tf) {
    var cv = $(tf.cv);
    var t1 = null;
    var pinch = null;
    var lastTap = 0, lastTapX = 0, lastTapY = 0;
    cv.addEventListener("touchstart", function (ev) {
      if (ev.touches.length === 1) {
        var t = ev.touches[0];
        t1 = { x: t.clientX, viewEndTs: viewEndTs };
        var now = Date.now();
        if (now - lastTap < 300 && Math.abs(t.clientX - lastTapX) < 30 && Math.abs(t.clientY - lastTapY) < 30) {
          viewEndTs = null; zoomLevel = 1; drawAll();
          lastTap = 0;
        } else {
          lastTap = now; lastTapX = t.clientX; lastTapY = t.clientY;
        }
      } else if (ev.touches.length === 2) {
        var a = ev.touches[0], b = ev.touches[1];
        pinch = { d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), zoom0: zoomLevel };
        t1 = null;
      }
      ev.preventDefault();
    }, { passive: false });
    cv.addEventListener("touchmove", function (ev) {
      if (ev.touches.length === 1 && t1) {
        var t = ev.touches[0];
        var dx = t.clientX - t1.x;
        var step = viewStep[tf.key] || 10;
        if (step > 0) {
          var shiftMs = (dx / step) * tf.ms;
          var base = t1.viewEndTs;
          if (base === null) {
            var arr = data[tf.key];
            base = arr.length ? arr[arr.length - 1][0] : Date.now();
          }
          viewEndTs = base - shiftMs;
          clampViewEnd();
          drawAll();
        }
      } else if (ev.touches.length === 2 && pinch) {
        var a2 = ev.touches[0], b2 = ev.touches[1];
        var d = Math.hypot(a2.clientX - b2.clientX, a2.clientY - b2.clientY);
        if (pinch.d0 > 0) {
          zoomLevel = Math.max(0.5, Math.min(6, pinch.zoom0 * (d / pinch.d0)));
          drawAll();
        }
      }
      ev.preventDefault();
    }, { passive: false });
    cv.addEventListener("touchend", function (ev) {
      if (ev.touches.length < 2) pinch = null;
      if (ev.touches.length === 0) t1 = null;
    });
    cv.addEventListener("touchcancel", function () { t1 = null; pinch = null; });
  }

  // ---- 시작 ----
  function resize() { drawAll(); }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });
  setStatus("poll", "불러오는 중…");
  TF.forEach(attachTouch);
  setInterval(updateCountdowns, 1000);
  Promise.all(TF.map(loadRest)).then(function () {
    hideErr();
    drawAll();
    connectWs();
    connectTrades();
    // 웹소켓이 6초 안에 안 붙으면 폴링으로 전환
    setTimeout(function () { if (!wsLive) startPolling(); }, 6000);
  }).catch(function (e) {
    showErr("캔들을 불러오지 못했어. 인터넷 확인하고 새로고침해줘. (" + (e && e.message ? e.message : "오류") + ")");
    setStatus("off", "연결 실패");
  });
})();
</script>
</body>
</html>
