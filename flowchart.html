<script>
(function(){
'use strict';
var svg=document.querySelector('svg');
if(!svg) return;
var NS='http://www.w3.org/2000/svg';
var EDGE_TOL=20, AH_TOL=25, AH_FB=30;

/* 박스 수집: rx 있는 rect + 안에 든 text */
var boxes=[], assigned=new Set();
var rects=Array.prototype.slice.call(svg.querySelectorAll('rect')).filter(function(r){return r.getAttribute('rx');});
rects.forEach(function(rect,i){
  var x=+rect.getAttribute('x'), y=+rect.getAttribute('y');
  var w=+rect.getAttribute('width'), h=+rect.getAttribute('height');
  var texts=Array.prototype.slice.call(svg.querySelectorAll('text')).filter(function(t){
    if(assigned.has(t)) return false;
    var tx=+t.getAttribute('x'), ty=+t.getAttribute('y');
    return tx>x&&tx<x+w&&ty>y&&ty<y+h;
  });
  texts.forEach(function(t){assigned.add(t);});
  rect.classList.add('dragbox');
  texts.forEach(function(t){t.classList.add('dragbox');});
  boxes.push({rect:rect, texts:texts,
    origStroke:rect.getAttribute('stroke'), origSW:rect.getAttribute('stroke-width')});
});
var el2box=new Map();
boxes.forEach(function(b){ el2box.set(b.rect,b); b.texts.forEach(function(t){el2box.set(t,b);}); });

/* 기하 */
function ptSeg(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy,t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function edgeDist(px,py,r){
  var x=+r.getAttribute('x'),y=+r.getAttribute('y'),w=+r.getAttribute('width'),h=+r.getAttribute('height');
  return Math.min(ptSeg(px,py,x,y,x+w,y),ptSeg(px,py,x+w,y,x+w,y+h),ptSeg(px,py,x+w,y+h,x,y+h),ptSeg(px,py,x,y+h,x,y));
}
function nearestBox(px,py,tol){
  var best=null,bd=tol;
  for(var i=0;i<boxes.length;i++){var d=edgeDist(px,py,boxes[i].rect);if(d<bd){bd=d;best=boxes[i];}}
  return best;
}
function parseD(d){
  var re=/([ML])\s*(-?[\d.]+)[,\s]+(-?[\d.]+)/g;
  if(/[^,\s]/.test(d.replace(re,''))) return null;
  var re2=/([ML])\s*(-?[\d.]+)[,\s]+(-?[\d.]+)/g,m2,pts=[];
  while((m2=re2.exec(d))) pts.push([+m2[2],+m2[3]]);
  return pts.length>=2?pts:null;
}

/* 연결선 */
var conns=[];
function liveEP(c){
  var el=c.el;
  if(c.kind==='line') return [[+el.getAttribute('x1'),+el.getAttribute('y1')],[+el.getAttribute('x2'),+el.getAttribute('y2')]];
  return parseD(el.getAttribute('d'));
}
Array.prototype.forEach.call(svg.querySelectorAll('line'),function(el){
  if(el.closest('defs'))return;
  var p1=[+el.getAttribute('x1'),+el.getAttribute('y1')],p2=[+el.getAttribute('x2'),+el.getAttribute('y2')];
  conns.push({el:el,kind:'line',f:nearestBox(p1[0],p1[1],EDGE_TOL),t:nearestBox(p2[0],p2[1],EDGE_TOL)});
});
Array.prototype.forEach.call(svg.querySelectorAll('path'),function(el){
  if(el.closest('defs'))return;
  var pts=parseD(el.getAttribute('d')); if(!pts)return;
  conns.push({el:el,kind:'path',f:nearestBox(pts[0][0],pts[0][1],EDGE_TOL),t:nearestBox(pts[pts.length-1][0],pts[pts.length-1][1],EDGE_TOL)});
});
/* 화살촉: 가장 가까운 연결선 정점에 귀속 */
var heads=[];
Array.prototype.forEach.call(svg.querySelectorAll('polygon'),function(el){
  var pts=el.getAttribute('points').trim().split(/\s+/).map(function(s){var p=s.split(',');return [+p[0],+p[1]];});
  var cx=pts.reduce(function(a,p){return a+p[0];},0)/pts.length;
  var cy=pts.reduce(function(a,p){return a+p[1];},0)/pts.length;
  var conn=null,vidx=0,bd=AH_TOL;
  conns.forEach(function(c){
    var eps=liveEP(c); if(!eps)return;
    eps.forEach(function(p,i){
      var d=Math.hypot(cx-p[0],cy-p[1]);
      if(d<bd){bd=d;conn=c;vidx=i;}
    });
  });
  var h={el:el,pts:pts,conn:conn,vidx:vidx,box:null};
  if(!conn) h.box=nearestBox(cx,cy,AH_FB);
  heads.push(h);
});

/* 핸들(연결점): 편집 모드에서만 표시 */
var handles=[];
function buildHandles(){
  handles.forEach(function(h){ h.el.remove(); });
  handles=[];
  if(!edit) return;
  conns.forEach(function(c){
    var eps=liveEP(c); if(!eps)return;
    eps.forEach(function(p,vidx){
      var cir=document.createElementNS(NS,'circle');
      cir.setAttribute('cx',p[0]); cir.setAttribute('cy',p[1]);
      cir.setAttribute('r',14); cir.setAttribute('class','handle');
      svg.appendChild(cir);
      var h={el:cir,conn:c,vidx:vidx};
      cir._h=h;
      handles.push(h);
    });
  });
}
function updateHandles(){
  handles.forEach(function(h){
    var eps=liveEP(h.conn); if(!eps||!eps[h.vidx])return;
    h.el.setAttribute('cx',eps[h.vidx][0]);
    h.el.setAttribute('cy',eps[h.vidx][1]);
  });
}

/* 이동 */
function moveHead(h,dx,dy){
  h.pts=h.pts.map(function(p){return [p[0]+dx,p[1]+dy];});
  h.el.setAttribute('points',h.pts.map(function(p){return p[0]+','+p[1];}).join(' '));
}
function moveConnVertex(c,vidx,dx,dy){
  var el=c.el;
  var eps0=liveEP(c); if(!eps0||!eps0[vidx])return;
  var preX=eps0[vidx][0], preY=eps0[vidx][1];
  if(c.kind==='line'){
    if(vidx===0){el.setAttribute('x1',preX+dx);el.setAttribute('y1',preY+dy);}
    else{el.setAttribute('x2',preX+dx);el.setAttribute('y2',preY+dy);}
  }else{
    var pts=parseD(el.getAttribute('d')); if(!pts||!pts[vidx])return;
    pts[vidx][0]+=dx; pts[vidx][1]+=dy;
    var cmds=el.getAttribute('d').match(/[ML]/g)||[];
    el.setAttribute('d',pts.map(function(p,j){return (cmds[j]||'L')+' '+p[0]+' '+p[1];}).join(' '));
  }
  /* 화살촉: 직접 귀속된 것 + 이동 전 같은 좌표에 겹친 정점의 화살촉도 함께 이동 */
  heads.forEach(function(h){
    if(!h.conn) return;
    var hx,hy;
    if(h.conn===c&&h.vidx===vidx){hx=preX;hy=preY;}
    else{
      var heps=liveEP(h.conn); if(!heps||!heps[h.vidx])return;
      hx=heps[h.vidx][0]; hy=heps[h.vidx][1];
    }
    if(Math.abs(hx-preX)<1&&Math.abs(hy-preY)<1) moveHead(h,dx,dy);
  });
  updateHandles();
}
function moveBox(b,dx,dy){
  var r=b.rect;
  r.setAttribute('x',+r.getAttribute('x')+dx);
  r.setAttribute('y',+r.getAttribute('y')+dy);
  b.texts.forEach(function(t){t.setAttribute('x',+t.getAttribute('x')+dx);t.setAttribute('y',+t.getAttribute('y')+dy);});
  conns.forEach(function(c){
    var eps=liveEP(c); if(!eps)return;
    if(c.f===b) moveConnVertex(c,0,dx,dy);
    if(c.t===b) moveConnVertex(c,eps.length-1,dx,dy);
  });
  heads.forEach(function(h){ if(h.box===b) moveHead(h,dx,dy); });
}
function checkOverlap(b){
  var r=b.rect,x=+r.getAttribute('x'),y=+r.getAttribute('y');
  var w=+r.getAttribute('width'),h=+r.getAttribute('height');
  var hit=boxes.some(function(o){
    if(o===b)return false;
    var or=o.rect,ox=+or.getAttribute('x'),oy=+or.getAttribute('y');
    var ow=+or.getAttribute('width'),oh=+or.getAttribute('height');
    return x<ox+ow-2&&x+w>ox+2&&y<oy+oh-2&&y+h>oy+2;
  });
  if(hit){r.setAttribute('stroke','#ef4444');r.setAttribute('stroke-width','5');}
  else{r.setAttribute('stroke',b.origStroke);r.setAttribute('stroke-width',b.origSW);}
}

/* 드래그 */
var edit=false,dragB=null,dragH=null,last=null;
function toSVG(e){
  var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown',function(e){
  if(!edit)return;
  var h=e.target._h;
  if(h){
    e.preventDefault();
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    h.el.classList.add('dragging');
    dragH=h; last=toSVG(e);
    return;
  }
  var b=el2box.get(e.target); if(!b)return;
  e.preventDefault();
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  last=toSVG(e); dragB=b;
});
svg.addEventListener('pointermove',function(e){
  if(!edit)return;
  if(dragH){
    e.preventDefault();
    var p=toSVG(e),dx=p.x-last.x,dy=p.y-last.y;
    last=p;
    if(dx||dy) moveConnVertex(dragH.conn,dragH.vidx,dx,dy);
    return;
  }
  if(!dragB)return;
  e.preventDefault();
  var p2=toSVG(e),dx2=p2.x-last.x,dy2=p2.y-last.y;
  last=p2;
  if(dx2||dy2) moveBox(dragB,dx2,dy2);
});
function endDrag(){
  if(dragH){dragH.el.classList.remove('dragging');dragH=null;}
  if(dragB){checkOverlap(dragB);dragB=null;}
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);

/* 캔버스 */
function applyCanvasSize(){
  try{
    var vb=svg.viewBox.baseVal;
    if(edit){ svg.style.width=vb.width+'px'; svg.style.height=vb.height+'px'; }
    else{ svg.style.width=''; svg.style.height=''; }
  }catch(_){}
}
function growCanvas(dx,dy){
  try{
    var vb=svg.viewBox.baseVal;
    vb.width+=dx; vb.height+=dy;
    applyCanvasSize();
  }catch(_){}
}

/* 툴바 */
var hint=document.querySelector('.hint'),hintOrig=hint?hint.textContent:'';
var tgl=document.getElementById('editToggle'),expB=document.getElementById('exportBtn'),rstB=document.getElementById('resetBtn');
var cwBtn=document.getElementById('cwBtn'),chBtn=document.getElementById('chBtn');
tgl.addEventListener('click',function(){
  edit=!edit;
  document.body.classList.toggle('editing',edit);
  tgl.textContent=edit?'편집 종료':'편집';
  tgl.classList.toggle('on',edit);
  expB.style.display=edit?'':'none';
  rstB.style.display=edit?'':'none';
  applyCanvasSize();
  cwBtn.style.display=edit?'':'none';
  chBtn.style.display=edit?'':'none';
  buildHandles();
  if(hint)hint.textContent=edit?'박스·주황 연결점을 드래그하여 이동 · 내보내기로 저장':hintOrig;
});
expB.addEventListener('click',function(){
  if(edit)tgl.click();
  var blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='anti_fomo_flowchart_edit.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
});
rstB.addEventListener('click',function(){if(confirm('편집 내용을 모두 되돌릴까요?'))location.reload();});
cwBtn.addEventListener('click',function(){growCanvas(400,0);});
chBtn.addEventListener('click',function(){growCanvas(0,400);});
})();
</script>
</body></html>
